[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usewren-client"
version = "0.5.0"
description = "Python client for the Wren versioned document store"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "respx>=0.21", "mypy>=1.10", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/wren"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.9"
files = ["src"]

[tool.coverage.run]
source = ["wren"]
branch = false

[tool.coverage.report]
show_missing = true
